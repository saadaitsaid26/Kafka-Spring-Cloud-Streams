<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page visits - real time analytics</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 40px auto;
            max-width: 900px;
            padding: 0 16px;
            color: #1f2937;
        }
        h1 { font-size: 22px; }
        p { color: #6b7280; }
        canvas {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-top: 16px;
        }
        .legend { margin-top: 12px; font-size: 14px; }
        .legend .p1 { color: #22c55e; font-weight: 600; }
        .legend .p2 { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Page visits in the last 5 seconds</h1>
    <p>Kafka Streams computes a rolling 5-second window count per page, streamed over SSE.</p>
    <canvas id="chart" width="868" height="300"></canvas>
    <div class="legend">
        <span class="p1">P1</span> visits &nbsp;|&nbsp; <span class="p2">P2</span> visits
    </div>

    <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.min.js"></script>
    <script>
        function makeSeries(color) {
            const series = new TimeSeries();
            chart.addTimeSeries(series, { strokeStyle: color, lineWidth: 2 });
            return series;
        }

        const chart = new SmoothieChart({ millisPerPixel: 60, grid: { strokeStyle: '#e5e7eb', verticalSections: 6 } });
        const p1 = makeSeries('#22c55e');
        const p2 = makeSeries('#ef4444');
        chart.streamTo(document.getElementById('chart'), 1000);

        const source = new EventSource('/analytics');
        source.onmessage = (event) => {
            const counts = JSON.parse(event.data);
            const now = Date.now();
            p1.append(now, counts.P1 || 0);
            p2.append(now, counts.P2 || 0);
        };
        source.onerror = () => {
            // The browser reconnection logic takes over automatically.
            console.warn('SSE connection lost — reconnection in progress…');
        };
    </script>
</body>
</html>
